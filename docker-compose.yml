name: visitor-counter

services:
  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: visitor-log-backend:${APP_VERSION:-latest}
    container_name: visitor-backend
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "5000"
      DATA_DIR: "/var/lib/backend_data"
      DATA_FILE: "visitor_logs.json"
      APP_VERSION: ${APP_VERSION:-1.0.0}
    volumes:
      - visitor-log-data:/var/lib/backend_data
    expose:
      - "5000"
    ports:
      - "${BACKEND_PORT:-5008}:5000"
    networks:
      - app-net

  frontend:
    image: nginx:1.27-alpine
    container_name: visitor-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    volumes:
      - ${FRONTEND_DIR:-./frontend}:/usr/share/nginx/html:ro
      - ${FRONTEND_DIR:-./frontend}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-net

networks:
  app-net:
    name: app-net
    driver: bridge

volumes:
  visitor-log-data:
    name: visitor-log-data
