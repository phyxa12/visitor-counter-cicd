# Nginx Frontend Configuration
# - Melayani file statis HTML/JS dari Bind Mount (/usr/share/nginx/html)
# - Meneruskan /api/* ke kontainer Backend via Docker DNS (http://backend:5000)
#   di dalam Custom Bridge Network (app-net)

server {
    listen 80;
    server_name _;

    # Resolver DNS internal Docker (127.0.0.11) dengan TTL pendek (5s)
    # agar saat kontainer backend dihapus & dibuat ulang (uji Data Immunity),
    # IP baru kontainer backend langsung dikenali tanpa perlu restart Nginx.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend_upstream backend:5000;

    root /usr/share/nginx/html;
    index index.html;

    # Nonaktifkan cache untuk file HTML/JS agar perubahan Bind Mount langsung terlihat
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: /api/logs -> http://backend:5000/logs
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # Endpoint health check internal Nginx
    location = /nginx-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"visitor-log-frontend"}';
    }
}
